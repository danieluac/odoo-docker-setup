# Incluído automaticamente pelo Makefile quando PG_TUNING=1 no .env.
# Postgres afinado para DEV Odoo: restores e testes MUITO mais rápidos.
# ⚠ Sem durabilidade em crash (fsync off) — NUNCA usar em produção.
services:
  db:
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c wal_level=minimal
      -c max_wal_senders=0
      -c max_wal_size=2GB
      -c checkpoint_timeout=30min
      -c checkpoint_completion_target=0.9
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c jit=off
      -c max_parallel_workers_per_gather=0
      -c autovacuum_naptime=300
      -c log_checkpoints=off
